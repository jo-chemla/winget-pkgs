name: Update WinGet Packages

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 1 * * *' # Scheduled to run every 2 hours from 1AM

jobs:
  update:
    name: Update package ${{ matrix.id }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # Manually chosen packages
          # libvips bugs, see https://github.com/microsoft/winget-pkgs/pull/324236#issuecomment-3674242124
          - id: libvips.libvips
            repo: libvips/build-win64-mxe
            url: '"https://github.com/libvips/build-win64-mxe/releases/download/v{VERSION}/vips-dev-x64-all-{VERSION}.zip https://github.com/libvips/build-win64-mxe/releases/download/v{VERSION}/vips-dev-arm64-all-{VERSION}.zip https://github.com/libvips/build-win64-mxe/releases/download/v{VERSION}/vips-dev-x86-all-{VERSION}.zip"'
          - id: f3d-app.f3d
            repo: f3d-app/f3d
            url: https://github.com/f3d-app/f3d/releases/download/v{VERSION}/F3D-{VERSION}-Windows-x86_64.exe
            
          # Found updates available between mismatching github release and winget version for all below packages
          # Could suggest auto github action workflow winget-releaser for below
          # https://github.com/arduino/arduino-cli/pull/3003
          - id: ArduinoSA.CLI
            repo: arduino/arduino-cli
            url: https://github.com/arduino/arduino-cli/releases/download/v{VERSION}/arduino-cli_{VERSION}_Windows_64bit.msi
          # Tricky dependencies https://github.com/microsoft/winget-pkgs/pull/293860 and https://github.com/microsoft/winget-pkgs/pull/317811
          #- id: JeniusApps.Ambie
          #  repo: jenius-apps/ambie
          #  url: https://github.com/jenius-apps/ambie/releases/download/v{VERSION}/Ambie_{VERSION}.0_x64_ARM64.msixbundle
            
          # winget-releaser Github action Workflow might be outdated for below packages
          # https://github.com/Victor-IX/Blender-Launcher-V2/blob/main/.github/workflows/release-winget.yml
          # fix https://github.com/Victor-IX/Blender-Launcher-V2/pull/283
          - id: VictorIX.BlenderLauncher
            repo: Victor-IX/Blender-Launcher-V2
            url: https://github.com/Victor-IX/Blender-Launcher-V2/releases/download/v{VERSION}/Blender_Launcher_v{VERSION}_Windows_x64.zip
          # https://github.com/schollz/croc/pull/991
          - id: schollz.croc
            repo: schollz/croc
            url: "https://github.com/schollz/croc/releases/download/v{VERSION}/croc_v{VERSION}_Windows-32bit.zip https://github.com/schollz/croc/releases/download/v{VERSION}/croc_v{VERSION}_Windows-64bit.zip https://github.com/schollz/croc/releases/download/v{VERSION}/croc_v{VERSION}_Windows-ARM.zip https://github.com/schollz/croc/releases/download/v{VERSION}/croc_v{VERSION}_Windows-ARM64.zip"

          # Package author/maintainer prefers outside winget auto-release
          # https://github.com/mikefarah/yq/pull/2479
          - id: MikeFarah.yq
            repo: mikefarah/yq
            url: '"https://github.com/mikefarah/yq/releases/download/v{VERSION}/yq_windows_amd64.exe https://github.com/mikefarah/yq/releases/download/v{VERSION}/yq_windows_386.exe"'
          # https://github.com/dyad-sh/dyad/pull/1657
          - id: Dyad.Dyad
            repo: dyad-sh/dyad
            url: https://github.com/dyad-sh/dyad/releases/download/v{VERSION}/dyad-{VERSION}.Setup.exe
          # https://github.com/Jacalz/rymdport/issues/168
          - id: Jacalz.Rymdport
            repo: Jacalz/rymdport
            url: https://github.com/Jacalz/rymdport/releases/download/v{VERSION}/rymdport-v{VERSION}-windows-x86_64.zip
          # https://github.com/Frontesque/scrcpy-plus/issues/63
          - id: Frontesque.scrcpy+
            repo: Frontesque/scrcpy-plus
            url: https://github.com/Frontesque/scrcpy-plus/releases/download/{VERSION}/scrcpy-plus-WINDOWS_x64-installer.exe
          # https://github.com/files-community/Files/issues/16374
          # Removing Files, see https://github.com/microsoft/winget-pkgs/pull/353664#issuecomment-4153620334
          # - id: FilesCommunity.Files
          #   repo: files-community/Files
          #   # url: https://cdn.files.community/files/stable/Files.Package_{VERSION}_Test/Files.Package_{VERSION}_x64_arm64.msixbundle
          #   url: https://cdn.files.community/files/stable/Files.Package/Files.Package_x64_arm64.msixbundle
          # https://github.com/TheWaWaR/simple-http-server/issues/135
          - id: TheWaWaR.simple-http-server
            repo: TheWaWaR/simple-http-server
            url: https://github.com/TheWaWaR/simple-http-server/releases/download/v{VERSION}/x86_64-pc-windows-msvc-simple-http-server.exe
          # https://github.com/tranxuanthang/lrcget/issues/180
          - id: LRCLIB.LRCGET
            repo: tranxuanthang/lrcget
            url: https://github.com/tranxuanthang/lrcget/releases/download/{VERSION}/LRCGET_{VERSION}_x64-setup.exe
          # updates too frequent for nostr, await this being merged https://github.com/mmalmi/nostr-vpn/issues/6
          # - id: mmalmi.nostr-vpn
          #   repo: mmalmi/nostr-vpn
          #   url: https://github.com/mmalmi/nostr-vpn/releases/download/v{VERSION}/nostr-vpn-v{VERSION}-windows-x64-setup.exe

            
    steps:
    - name: Update Packages
      uses: michidk/winget-updater@latest
      with:
        komac-token: ${{ secrets.KOMAC_TOKEN }}
        identifier: ${{ matrix.id }}
        repo: ${{ matrix.repo }}
        url: ${{ matrix.url }}

